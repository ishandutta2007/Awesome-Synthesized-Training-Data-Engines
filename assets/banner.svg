<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#161233"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pulse-glow {
        animation: pulseGlow 6s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.75; transform: scale(1.02); }
      }

      .stream-flow {
        stroke-dasharray: 12 18;
        animation: dashMove 25s linear infinite;
      }
      .stream-flow-reverse {
        stroke-dasharray: 8 14;
        animation: dashMoveRev 18s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dashMoveRev {
        to { stroke-dashoffset: 1000; }
      }

      .float-node {
        animation: nodeFloat 5s ease-in-out infinite alternate;
      }
      .float-node-2 {
        animation: nodeFloat2 6.5s ease-in-out infinite alternate;
      }
      .float-node-3 {
        animation: nodeFloat3 4.5s ease-in-out infinite alternate;
      }
      @keyframes nodeFloat {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-12px) translateX(6px); }
      }
      @keyframes nodeFloat2 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(14px) translateX(-8px); }
      }
      @keyframes nodeFloat3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      .pill-pulse {
        animation: pillBlink 4s ease-in-out infinite alternate;
      }
      @keyframes pillBlink {
        0% { opacity: 0.75; }
        100% { opacity: 1; }
      }

      .grid-lines {
        stroke: #334155;
        stroke-opacity: 0.22;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle Perspective Grid in Background -->
  <g class="grid-lines">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="120" r="300" fill="url(#glowViolet)" class="pulse-glow"/>
  <circle cx="1020" cy="300" r="280" fill="url(#glowCyan)" class="pulse-glow"/>
  <circle cx="600" cy="380" r="220" fill="url(#glowPink)" class="pulse-glow"/>

  <!-- Dynamic Animated Data Stream Lines (Kept in Background behind title) -->
  <g opacity="0.45">
    <path d="M -50 80 Q 300 20 600 90 T 1250 60" fill="none" stroke="#38bdf8" stroke-width="2.5" class="stream-flow"/>
    <path d="M -50 340 Q 350 390 700 320 T 1250 350" fill="none" stroke="#818cf8" stroke-width="2.5" class="stream-flow-reverse"/>
    <path d="M 100 0 Q 300 220 550 180 T 1100 420" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="6 12" class="stream-flow"/>
    <path d="M 1150 20 Q 900 200 650 240 T 100 400" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="10 14" class="stream-flow-reverse"/>
  </g>

  <!-- Floating Dynamic Nodes & Synthetic Geometry (Behind/Flanking Text) -->
  <g class="float-node" opacity="0.65">
    <circle cx="140" cy="220" r="8" fill="#38bdf8" filter="url(#blurGlow)"/>
    <circle cx="140" cy="220" r="4" fill="#ffffff"/>
    <line x1="140" y1="220" x2="210" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="210" cy="160" r="6" fill="#818cf8"/>
  </g>

  <g class="float-node-2" opacity="0.65">
    <circle cx="1060" cy="180" r="9" fill="#c084fc" filter="url(#blurGlow)"/>
    <circle cx="1060" cy="180" r="4" fill="#ffffff"/>
    <line x1="1060" y1="180" x2="980" y2="240" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="980" cy="240" r="5" fill="#38bdf8"/>
  </g>

  <g class="float-node-3" opacity="0.5">
    <circle cx="90" cy="100" r="5" fill="#ec4899"/>
    <circle cx="1110" cy="90" r="6" fill="#06b6d4"/>
    <circle cx="1020" cy="95" r="4" fill="#a855f7"/>
  </g>

  <!-- FOREGROUND LAYER: Badges, Title & Subtitles (Clear & Prominent) -->

  <!-- Top Category Chip -->
  <g transform="translate(425, 42)">
    <rect width="350" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" class="pill-pulse"/>
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#blurGlow)"/>
    <text x="36" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM • 2026</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 150)">
    <text x="0" y="0" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.7))">
      Awesome Synthesized Training Data Engines
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 196)">
    <text x="0" y="0" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      Privacy-Preserving Data Generation, Differential Privacy, GANs &amp; Synthetic Simulation Platforms
    </text>
  </g>

  <!-- Bottom Feature Badges / Highlights (Anchored safely below text) -->
  <g transform="translate(180, 260)">
    <!-- Pill 1: Tabular & Relational -->
    <g transform="translate(0, 0)" class="float-node-3">
      <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="90" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 Tabular &amp; Time-Series</text>
    </g>

    <!-- Pill 2: Differential Privacy -->
    <g transform="translate(205, 0)" class="float-node-3">
      <rect width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="100" y="26" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Differential Privacy (DP)</text>
    </g>

    <!-- Pill 3: Computer Vision & Simulation -->
    <g transform="translate(430, 0)" class="float-node-3">
      <rect width="215" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="107" y="26" text-anchor="middle" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">👁️ Vision, 3D &amp; Sensor Sim</text>
    </g>

    <!-- Pill 4: LLM & GenAI Fine-Tuning -->
    <g transform="translate(670, 0)" class="float-node-3">
      <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="90" y="26" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 LLM Synthetic Tuning</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="300" y1="365" x2="900" y2="365" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
